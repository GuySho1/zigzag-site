<style>
/* Calm and short. The first screen is a quiet composition: two staggered panels of the brand's ink Tel Aviv and, between them,
   one plain message from the agent. Motion: the panels settle in on load, drift apart as the page starts to scroll,
   and the one sentence that explains the service lights up line by line. Text never waits for motion. */
@font-face{font-family:Heebo;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/heebo-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/heebo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-weight:900;font-display:swap;src:url(fonts/heebo-hebrew-900-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/heebo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:Heebo;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/heebo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:Heebo;font-style:normal;font-weight:900;font-display:swap;src:url(fonts/heebo-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}

:root{
  --bg:#F3EADA; --bg2:#FBF6EC; --fg:#0A061B; --text:#3A3550; --dim:#6A6480; --moon:#8526FD; --moon-deep:#5B14C4; --line:#0A061B; --btn-fg:#FFFFFF; --focus:#0A061B;
  --navbg:#F3EADA; --font:Heebo,"Arial Hebrew",Arial,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --gut:max(20px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:4px 36px}
h1{margin:0;font-weight:700;font-size:clamp(27px,8.3vw,40px);line-height:1.14;letter-spacing:-.005em;text-wrap:balance}
h1 span{display:block}

/* by the book: one clear headline, the capabilities in plain sight, details open on request, one action */
.sub{margin:0;font-size:17px;line-height:1.5;color:var(--text);text-wrap:pretty}
/* the scene: one illustration, brought to life in code (window lights, coat in the wind, birds); the <img> is the real picture and the fallback */
.scene{position:relative;margin:0;margin-inline:calc(-1 * var(--gut));aspect-ratio:4/3;overflow:hidden;background:var(--bg)}
.sc-img,.sc-gl,.sc-birds{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc-img{object-fit:cover;object-position:47% 50%}
.sc-gl{opacity:0;transition:opacity .4s var(--ease-out)}
.scene.live .sc-gl{opacity:1}
.sc-pause{position:absolute;inset-block-end:6px;inset-inline-start:max(10px,env(safe-area-inset-left,0px));min-height:44px;padding:0 12px;border:0;border-radius:999px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.caps{display:grid;grid-template-columns:minmax(0,1fr)}
.caps h2{margin:6px 0 10px;font-size:19px;font-weight:700;color:var(--fg);text-align:center;text-wrap:balance}
.caps details{border-top:1.5px solid color-mix(in srgb,var(--fg) 20%,transparent)}
.caps details:last-of-type{border-bottom:1.5px solid color-mix(in srgb,var(--fg) 20%,transparent)}
.caps summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;font-weight:700;font-size:19px}
.caps summary::-webkit-details-marker{display:none}
.caps summary::after{content:'+';flex:none;font-weight:400;font-size:26px;line-height:1;color:var(--moon)}
.caps details[open] summary::after{content:'–'}
.caps details p.fit{margin:-6px 0 14px;font-size:14.5px;font-weight:700;color:var(--moon-deep)}
.caps details p{margin:0 0 14px;font-size:16.5px;line-height:1.55;color:var(--text);max-width:60ch}
.act{display:grid;grid-template-columns:minmax(0,1fr);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:999px;background:var(--moon);color:var(--btn-fg);font:inherit;font-weight:700;font-size:18px;white-space:nowrap;text-decoration:none;border:0;cursor:pointer;transition:transform .14s var(--ease-out)}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{background:var(--moon-deep)}}
/* the paragraph that carries the trust: fifteen years, and what is inside the agent's head */
.brain{margin-top:14px;padding:20px 20px 22px;background:var(--fg);color:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-inline:calc(-1 * var(--gut));padding-inline:var(--gut)}
.brain p{margin:0}
.b-top{display:flex;align-items:center;gap:14px}
.b-num{font-weight:900;font-size:86px;line-height:.9;color:#B58CFF}
.b-lead{font-weight:700;font-size:24px;line-height:1.15}
.b-text{font-size:17px;line-height:1.6;color:#DCD5EA}
.b-text strong{color:var(--bg);font-weight:700}
.b-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}
.b-list li{font-weight:900;font-size:clamp(20px,5.6vw,26px);line-height:1.3;padding-block:8px;border-top:1.5px solid color-mix(in srgb,var(--bg) 28%,transparent)}
.b-end{font-size:17px;color:#DCD5EA}
/* the closing: the promise, then one short form in a card */
.lead{padding-block:44px 56px}
.l-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.lead h2{margin:0;display:grid;gap:6px;position:relative;padding-top:22px}
.lead h2::before{content:'';position:absolute;top:0;inset-inline-start:0;width:56px;height:7px;background:var(--moon)}
.l1{font-weight:400;font-size:clamp(24px,6.8vw,36px);line-height:1.15}
.l2{font-weight:900;font-size:clamp(50px,15vw,92px);line-height:.98;letter-spacing:-.01em}
.l-form{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;background:#FFFBF2;border:1.5px solid var(--line);border-radius:20px;padding:22px 18px 20px}
.f{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0}
.f label,.f legend{font-weight:700;font-size:16px;padding:0}
.f legend{margin-bottom:8px}
.f input[type=text],.f input[type=tel]{width:100%;min-height:52px;padding:0 14px;border:1.5px solid color-mix(in srgb,var(--fg) 45%,transparent);border-radius:12px;background:#fff;color:var(--fg);font:inherit;font-size:18px}
.f input[type=text]:focus,.f input[type=tel]:focus{border-color:var(--moon);outline:2px solid var(--moon);outline-offset:0}
.f input[type=tel]{text-align:right}
.hint{margin:0;font-size:14px;color:var(--dim)}
.err{margin:0;font-size:15px;font-weight:700;color:#B3261E}
.f input[aria-invalid="true"]{border-color:#B3261E;border-width:2.5px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ck{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 8px;border:1.5px solid color-mix(in srgb,var(--fg) 45%,transparent);border-radius:999px;font-weight:400!important;font-size:16px!important;text-align:center;cursor:pointer;transition:background-color .15s var(--ease-out),color .15s var(--ease-out)}
.ck input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ck:has(input:checked){background:var(--fg);border-color:var(--fg);color:#FFFBF2;font-weight:700!important}
.ck:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.l-form .btn{margin-top:4px;min-height:56px}
.state{margin:0;font-size:16px;font-weight:700}
.wa-btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);font-weight:700;font-size:16px;text-decoration:none}
/* the site footer, compact: it must not add a screen of scrolling */
.foot{color:#F3EADA;background:#0A061B;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));font-size:15px}
.ft{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 22px;text-align:center}
.ft-logo{display:flex;align-items:center;min-height:44px}
.ft-logo svg{height:22px;width:auto;display:block}
.foot a{color:#F3EADA;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
@media (hover:hover){.foot a:hover{color:#C9A9FF}}
.foot :focus-visible{outline-color:#F3EADA}
.ft-contact{margin:0;display:flex;justify-content:center;gap:0 16px;flex-wrap:wrap}
.ft-contact a:last-child{display:none}
.ft-nav{flex:0 0 100%;display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;border-top:1px solid rgba(243,234,218,.18);margin-top:4px;padding-top:2px}
.ft-nav{order:3} .ft-copy{order:4}
.ft-copy{flex:0 0 100%;margin:0;font-size:12.5px;color:#B9B0D6}
.stick{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1.5px solid color-mix(in srgb,var(--fg) 20%,transparent);display:grid;transition:transform .25s var(--ease-out)}
.stick.off{transform:translateY(110%)}
.stick .btn{min-height:50px}
@media (min-width:900px){
  .hero-grid{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);grid-template-areas:"h scene" "sub scene" "caps scene" "act scene" "brain brain";column-gap:56px;row-gap:16px;padding-block:18px 40px;align-items:start}
  h1{grid-area:h;align-self:end;font-size:clamp(40px,4vw,58px)}
  .sub{grid-area:sub;font-size:19px}
  .scene{grid-area:scene;margin-inline:0;aspect-ratio:16/9;align-self:start;border-radius:2px}
  .sc-img{object-position:50% 50%}
  .caps{grid-area:caps} .act{grid-area:act;justify-items:start}
  .caps summary{min-height:58px;font-size:21px} .caps details p{font-size:17.5px}
  .brain{grid-area:brain;margin-inline:0;padding:30px 36px;grid-template-columns:auto minmax(0,1fr) minmax(0,1.1fr);column-gap:40px;align-items:center;margin-top:22px}
  .b-top{grid-row:1 / span 2} .b-num{font-size:120px} .b-lead{font-size:30px}
  .b-text{grid-column:2;grid-row:1} .b-end{grid-column:2;grid-row:2}
  .b-list{grid-column:3;grid-row:1 / span 2} .b-list li{font-size:28px}
  .lead{padding-block:64px 80px}
  .l-grid{grid-template-columns:minmax(0,1fr) minmax(0,460px);column-gap:64px;align-items:center}
  .l-form{padding:28px 26px 24px}
  .stick{display:none}
  .foot{padding:10px 0}
  .ft{gap:0 32px}
  .ft-nav{flex:0 0 auto;order:0;border:0;margin:0;padding:0;gap:0 24px}
  .ft-contact{order:0;flex-wrap:nowrap} .ft-contact a:last-child{display:inline-flex}
  .ft-copy{flex:0 0 auto;order:0}
}
@media (prefers-reduced-motion:reduce){ .city canvas{transition:none} .btn,.stick{transition:none} .sc-gl{transition:none} }
#top{padding-top:calc(64px + env(safe-area-inset-top,0px))}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.nav a.btn{border-radius:0;font-size:15px;width:auto}
.nav a[aria-current=page]{font-weight:700;color:var(--moon-deep)}
__NAV_CSS__</style>
